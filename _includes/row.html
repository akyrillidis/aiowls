{%- assign p = include.post -%}
<li><a class="row" href="{{ p.url | relative_url }}">
  <div class="row-media"><img src="{{ p.thumb | relative_url }}" alt="{{ p.thumb_alt | escape }}" loading="lazy"></div>
  <div class="row-body">
    <p class="card-meta"><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%b %-d, %Y" }}</time><span aria-hidden="true">&middot;</span><span>{{ p.minutes }} min read</span>{% if p.series %}<span aria-hidden="true">&middot;</span><span>{{ p.series }}</span>{% endif %}</p>
    <h3 class="card-title">{{ p.title }}</h3>
    <p class="card-sum">{{ p.summary }}</p>
    <p class="card-by">{{ p.authors }}</p>
  </div>
</a></li>
