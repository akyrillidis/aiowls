---
layout: default
log: true
---
<section class="hero" aria-label="{{ site.title | strip }}">
  <canvas id="field-a" aria-hidden="true"></canvas><canvas id="field-b" aria-hidden="true"></canvas>
  <div class="hero-over">
    <div>
      <p class="kick">{{ site.hero_eyebrow }} &middot; live</p>
      <h1 class="hero-title">{{ site.title | strip }}</h1>
      <p class="hero-dek">{{ site.hero_dek | default: site.subtitle }}</p>
    </div>
    <div class="readout js-only" id="readout" aria-hidden="true"></div>
  </div>
</section>

{% include log.html %}

<section class="about" aria-labelledby="about-h">
  <div class="split">
    <h2 id="about-h" class="section-title">{{ site.about_heading | default: "About" }}</h2>
    <div class="about-body">
{{ content }}
    </div>
  </div>
</section>

<section id="people" class="people" aria-labelledby="people-h">
  <div class="split">
    <h2 id="people-h" class="section-title">People</h2>
    <div>{% include people.html %}</div>
  </div>
</section>
<script src="{{ '/assets/js/field.js' | relative_url }}" defer></script>
