---
layout: default
---
<header class="page-head">
  <p class="kick">{{ page.eyebrow | default: page.title }}</p>
  {%- if page.heading %}
  <h1 class="page-title">{{ page.heading }}</h1>
  {%- endif %}
</header>
<article class="page">
  <div class="{{ page.page_class }}">
{{ content }}
  </div>
</article>
