# Map view of the research log (assets/js/log.js). Posts sit on a 1600 x 1000 plane at the map: [x, y]
# given in _data/posts.yml (a post without one waits in a row at the bottom). Edges join posts that
# state the relation (companion, builds on, same series); the label shows when either note is hovered.
axes:
  left: "← PROOFS"
  right: "EXPERIMENTS →"
  top: "↑ TRAINING & OPTIMIZATION"
  bottom: "↓ MODELS & SCIENCE"
edges:
  - [/one_rank_at_a_time.html, /adapad.html, companion]
  - [/parallel_deflation.html, /adapad.html, parallel deflation]
  - [/ghost_mamba2.html, /magnitude_safety.html, builds on GHOST]
  - [/guided_deq.html, /measuring_relaxation.html, companion]
